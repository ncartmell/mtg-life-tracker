name: release

# The desktop packager only ever builds for the machine it runs on, so each format
# needs its own runner. Pushing a v* tag builds them all and attaches them to that
# tag's release.
on:
  push:
    tags: ['v*']
  # Lets a release be rebuilt without moving the tag — and covers the case where the
  # tag was pushed before this file existed, so the push never triggered anything.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            task: packageReleaseExe
            glob: composeApp/build/compose/binaries/main-release/exe/*.exe
          - name: windows-msi
            os: windows-latest
            task: packageReleaseMsi
            glob: composeApp/build/compose/binaries/main-release/msi/*.msi
          - name: linux
            os: ubuntu-latest
            task: packageReleaseDeb
            glob: composeApp/build/compose/binaries/main-release/deb/*.deb
          - name: macos-arm64
            os: macos-14
            task: packageReleaseDmg
            glob: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          # Intel, and on a clock. macos-13 was retired in December 2025, which is why
          # this job sat queued forever and every release since 1.6.0 went out without an
          # Intel dmg — a job that never starts also leaves the whole run showing as in
          # progress, so a genuinely stuck release looks no different from a healthy one.
          # macos-15-intel is the replacement and GitHub drops x86_64 macOS altogether
          # when it retires in autumn 2027, so this buys time rather than fixing it for
          # good. An Apple Silicon build is no substitute: Rosetta translates x86 to ARM,
          # not the other way, so an Intel Mac cannot run the arm64 dmg at all.
          - name: macos-x64
            os: macos-15-intel
            task: packageReleaseDmg
            glob: composeApp/build/compose/binaries/main-release/dmg/*.dmg

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # :composeApp is only included when an Android SDK is present, and the desktop
      # packaging tasks live in that module, so the SDK has to exist even though nothing
      # here builds for Android. packages is emptied deliberately: the action's default
      # installs the obsolete "tools" package, which no longer exists in the SDK
      # repositories and fails the whole step. Gradle fetches what it actually needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Package
        run: ./gradlew ${{ matrix.task }} --no-daemon
        shell: bash

      - name: Name the artefact by platform
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          for f in ${{ matrix.glob }}; do
            ext="${f##*.}"
            cp "$f" "dist/mtg-life-tracker-${TAG#v}-${{ matrix.name }}.${ext}"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: Attach to the release
        if: startsWith(env.TAG, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Several matrix jobs race here, so creating is best-effort and uploading
          # retries: whichever job gets there first wins and the rest just attach.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes \
            || true
          for attempt in 1 2 3; do
            gh release upload "$TAG" dist/* --clobber && exit 0
            sleep 10
          done
          exit 1

  ios:
    name: ios-unsigned
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Unsigned deliberately. Signing for a device needs an Apple Developer Program
      # membership; this produces the same .ipa, which AltStore, SideStore or Sideloadly
      # re-sign with the installing person's own Apple ID.
      - name: Build for device, unsigned
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO build

      - name: Wrap it as an ipa
        run: |
          mkdir -p payload/Payload dist
          cp -R build/ios-device/Build/Products/Release-iphoneos/iosApp.app payload/Payload/
          (cd payload && zip -qr "../dist/mtg-life-tracker-${TAG#v}-ios-unsigned.ipa" Payload)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*

      - name: Attach to the release
        if: startsWith(env.TAG, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes \
            || true
          for attempt in 1 2 3; do
            gh release upload "$TAG" dist/* --clobber && exit 0
            sleep 10
          done
          exit 1
